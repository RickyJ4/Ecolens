<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EcoLens 3D Simulation</title>
<script src="https://cesium.com/downloads/cesiumjs/releases/1.125/Build/Cesium/Cesium.js"></script>
<link href="https://cesium.com/downloads/cesiumjs/releases/1.125/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body,#cesiumContainer{width:100%;height:100%;overflow:hidden;background:#000;}
.cesium-viewer-toolbar,.cesium-viewer-animationContainer,.cesium-viewer-timelineContainer,
.cesium-viewer-fullscreenContainer,.cesium-viewer-infoBoxContainer,.cesium-viewer-geocoderContainer,
.cesium-viewer-bottom{display:none!important;}
.cesium-credit-logoContainer{opacity:0.3!important;font-size:10px!important;}

#controls{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,0.92) 30%);
padding:1rem 1.5rem 0.8rem;z-index:100;display:flex;flex-direction:column;gap:0.4rem;font-family:'Inter',system-ui,-apple-system,sans-serif;color:#fff;}
#timeline-row{display:flex;align-items:center;gap:0.8rem;}
#timeline{flex:1;height:6px;-webkit-appearance:none;appearance:none;background:rgba(255,255,255,0.15);border-radius:3px;cursor:pointer;outline:none;}
#timeline::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#FF4500;cursor:pointer;box-shadow:0 0 8px rgba(255,69,0,0.6);}
#btn-row{display:flex;align-items:center;gap:0.5rem;font-size:0.78rem;}
.cb{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:#fff;padding:6px 14px;
border-radius:6px;cursor:pointer;font-size:0.75rem;font-family:inherit;transition:all 0.2s;}
.cb:hover{background:rgba(255,255,255,0.15);}
.cb.on{background:rgba(255,69,0,0.35);border-color:rgba(255,69,0,0.6);}
#date-label{font-weight:600;min-width:120px;font-size:0.85rem;}
#stats-label{margin-left:auto;opacity:0.6;font-size:0.72rem;}

#info{position:fixed;top:16px;right:16px;background:rgba(8,8,16,0.9);backdrop-filter:blur(16px);
color:#fff;padding:18px 22px;border-radius:14px;max-width:340px;z-index:100;font-family:'Inter',system-ui,sans-serif;
border:1px solid rgba(255,255,255,0.06);box-shadow:0 8px 32px rgba(0,0,0,0.4);}
#info h3{margin:0 0 6px;font-size:15px;font-weight:700;}
#info p{margin:0 0 12px;font-size:11.5px;opacity:0.6;line-height:1.5;}
.sr{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:11.5px;}
.sr span:last-child{opacity:0.6;}
#info-src{margin-top:10px;font-size:9px;opacity:0.3;}

#story{position:fixed;left:16px;top:72px;width:360px;max-width:calc(100vw - 420px);z-index:100;
background:rgba(8,8,16,0.84);backdrop-filter:blur(18px);color:#fff;border-radius:14px;
border:1px solid rgba(255,255,255,0.08);box-shadow:0 12px 40px rgba(0,0,0,0.38);font-family:'Inter',system-ui,sans-serif;overflow:hidden;}
#story-head{padding:14px 16px 10px;border-bottom:1px solid rgba(255,255,255,0.06);}
#story-kicker{display:block;margin-bottom:4px;color:#58A6FF;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:0.8px;}
#story-title{margin:0;font-size:15px;line-height:1.25;}
#story-body{padding:12px 16px;}
#story-stage{display:inline-flex;align-items:center;gap:6px;margin-bottom:8px;padding:4px 8px;border-radius:999px;
background:rgba(88,166,255,0.14);border:1px solid rgba(88,166,255,0.28);color:#B9D9FF;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:0.5px;}
#story-text{font-size:12px;line-height:1.55;color:rgba(255,255,255,0.72);margin-bottom:12px;}
#story-rail{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:10px 0 12px;}
.story-dot{height:4px;border-radius:999px;background:rgba(255,255,255,0.14);}
.story-dot.on{background:#58A6FF;box-shadow:0 0 10px rgba(88,166,255,0.6);}
#story-intel{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px;}
.story-chip{padding:8px;border-radius:8px;background:rgba(255,255,255,0.045);border:1px solid rgba(255,255,255,0.06);}
.story-chip span{display:block;margin-bottom:3px;color:rgba(255,255,255,0.42);font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:0.45px;}
.story-chip strong{display:block;color:#fff;font-size:11px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#story-actions{display:flex;gap:8px;}
#story-actions button{height:30px;flex:1;border-radius:7px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.07);
color:#fff;font-size:11px;font-weight:800;cursor:pointer;}
#story-actions button:hover{border-color:#58A6FF;background:rgba(88,166,255,0.16);}
#visual-note{position:fixed;left:16px;bottom:86px;z-index:100;color:rgba(255,255,255,0.62);
font-family:'Inter',system-ui,sans-serif;font-size:11px;background:rgba(0,0,0,0.42);border:1px solid rgba(255,255,255,0.08);
border-radius:8px;padding:7px 10px;backdrop-filter:blur(10px);}

#scene-sel{position:fixed;top:16px;left:16px;z-index:100;display:flex;flex-wrap:wrap;gap:0.35rem;max-width:calc(100% - 400px);}
#scene-sel button{background:rgba(8,8,16,0.75);border:1px solid rgba(255,255,255,0.1);color:#fff;
padding:6px 12px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:11px;backdrop-filter:blur(10px);transition:all 0.2s;white-space:nowrap;}
#scene-sel button.on{background:rgba(255,69,0,0.4);border-color:rgba(255,69,0,0.5);}
#exit-btn{position:fixed;top:16px;right:370px;z-index:100;background:rgba(200,30,30,0.85);color:#fff;
border:none;padding:8px 18px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:12px;font-weight:600;
backdrop-filter:blur(8px);transition:all 0.2s;}
#exit-btn:hover{background:rgba(220,40,40,1);}

#loading{position:fixed;inset:0;background:#050510;display:flex;flex-direction:column;align-items:center;
justify-content:center;z-index:2000;transition:opacity 1s;color:#fff;font-family:'Inter',system-ui,sans-serif;}
#loading.gone{opacity:0;pointer-events:none;}
.ld-title{font-size:22px;font-weight:700;margin-bottom:8px;}
.ld-sub{font-size:13px;opacity:0.5;}
.ld-spin{width:40px;height:40px;border:3px solid rgba(255,255,255,0.1);border-top-color:#FF4500;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:20px;}
@keyframes spin{to{transform:rotate(360deg)}}

#err-banner{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(200,30,30,0.9);
color:#fff;padding:10px 20px;border-radius:8px;font-size:12px;z-index:200;display:none;max-width:600px;text-align:center;}
@media(max-width:900px){
  #story{top:64px;left:10px;right:10px;width:auto;max-width:none;}
  #info{top:auto;bottom:110px;right:10px;left:10px;max-width:none;}
  #visual-note{display:none;}
  #scene-sel{max-width:calc(100% - 20px);}
}
</style>
</head>
<body>

<div id="loading">
  <div class="ld-spin"></div>
  <div class="ld-title">Loading 3D World</div>
  <div class="ld-sub" id="ld-msg">Connecting to Google Photorealistic 3D Tiles...</div>
</div>

<div id="cesiumContainer"></div>
<div id="err-banner"></div>

<div id="scene-sel">
  <button id="sel-camp-fire" class="on" onclick="switchScene('camp-fire')">🔥 Camp Fire</button>
  <button id="sel-black-summer-2019" onclick="switchScene('black-summer-2019')">🔥 Black Summer</button>
  <button id="sel-maui-lahaina-2023" onclick="switchScene('maui-lahaina-2023')">🔥 Maui Lahaina</button>
  <button id="sel-canada-wildfires-2023" onclick="switchScene('canada-wildfires-2023')">🔥 Canada 2023</button>
  <button id="sel-pakistan-floods-2022" onclick="switchScene('pakistan-floods-2022')">🌊 Pakistan Floods</button>
  <button id="sel-ahr-valley-2021" onclick="switchScene('ahr-valley-2021')">🌊 Ahr Valley</button>
  <button id="sel-jakobshavn-glacier" onclick="switchScene('jakobshavn-glacier')">🏔️ Jakobshavn</button>
  <button id="sel-gangotri-glacier" onclick="switchScene('gangotri-glacier')">🏔️ Gangotri</button>
  <button id="sel-amazon-deforestation-2019" onclick="switchScene('amazon-deforestation-2019')">🌳 Amazon</button>
  <button id="sel-us-megadrought-2020" onclick="switchScene('us-megadrought-2020')">☀️ Mega-Drought</button>
</div>
<button id="exit-btn" onclick="exitSim()">✕ Exit</button>

<div id="info">
  <h3 id="i-title"></h3>
  <p id="i-desc"></p>
  <div id="i-stats"></div>
  <div id="info-src"></div>
</div>

<div id="story">
  <div id="story-head">
    <span id="story-kicker">3D Event Story</span>
    <h3 id="story-title"></h3>
  </div>
  <div id="story-body">
    <div id="story-stage"></div>
    <div id="story-text"></div>
    <div id="story-rail"></div>
    <div id="story-intel"></div>
    <div id="story-actions">
      <button onclick="narrateStoryBeat()">Narrate Beat</button>
      <button onclick="focusImpact()">Focus Impact</button>
    </div>
  </div>
</div>

<div id="visual-note">Visual reconstruction: highlighted overlays are illustrative footprints for briefing, not per-pixel verified inundation/burn mapping.</div>

<div id="controls">
  <div id="timeline-row">
    <span id="date-label"></span>
    <input type="range" id="timeline" min="0" max="1000" value="0">
    <span id="pct">0%</span>
  </div>
  <div id="btn-row">
    <button class="cb" id="btn-play" onclick="togglePlay()">▶ Play</button>
    <button class="cb" onclick="setSpd(1)" id="s1">1x</button>
    <button class="cb on" onclick="setSpd(2)" id="s2">2x</button>
    <button class="cb" onclick="setSpd(5)" id="s5">5x</button>
    <button class="cb" onclick="toggleOrbit()" id="btn-orbit">🎬 Cinematic</button>
    <span id="stats-label"></span>
  </div>
</div>

let viewer, tileset;
let cur = 'camp-fire', prog = 0, spd = 2, playing = false, orbiting = false, orbAngle = 0;
let fireEnt = null, smokeEmitters = [], calloutEntities = [], lastStoryStage = -1;
let storyVoice = null;

// ─── INIT ───────────────────────────────────────────
async function init() {
  const msg = document.getElementById('ld-msg');

  try {
    // Set concurrency for Google tile server
    Cesium.RequestScheduler.requestsByServer["tile.googleapis.com:443"] = 18;

    msg.textContent = 'Initializing 3D viewer...';

    viewer = new Cesium.Viewer('cesiumContainer', {
      globe: false,
      baseLayerPicker: false,
      timeline: false,
      animation: false,
      homeButton: false,
      geocoder: false,
      sceneModePicker: false,
      navigationHelpButton: false,
      fullscreenButton: false,
      infoBox: false,
      selectionIndicator: false,
      requestRenderMode: true,
      maximumRenderTimeChange: Infinity,
    });

    if (!API_KEY) {
      throw new Error('No Google Map Tiles key. Copy keys.example.js to keys.js and add one.');
    }
    msg.textContent = 'Loading Google Photorealistic 3D Tiles...';

    tileset = await Cesium.Cesium3DTileset.fromUrl(
      `https://tile.googleapis.com/v1/3dtiles/root.json?key=${API_KEY}`,
      { showCreditsOnScreen: true }
    );
    viewer.scene.primitives.add(tileset);
    console.log('[3D] Google Photorealistic 3D Tiles loaded!');

    msg.textContent = 'Flying to location...';
    setTimeout(() => document.getElementById('loading').classList.add('gone'), 1500);

    loadScene(getHash());
    tick();

  } catch (e) {
    console.error('[3D] Init failed:', e);
    msg.textContent = 'Tiles failed — loading satellite fallback...';
    showErr('Google 3D Tiles: ' + (e.message || e));

    // Fallback: globe with ESRI satellite
    try {
      if (viewer) viewer.destroy();
      viewer = new Cesium.Viewer('cesiumContainer', {
        baseLayerPicker: false, timeline: false, animation: false,
        homeButton: false, geocoder: false, sceneModePicker: false,
        navigationHelpButton: false, fullscreenButton: false,
        infoBox: false, selectionIndicator: false,
        imageryProvider: new Cesium.UrlTemplateImageryProvider({
          url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
          maximumLevel: 19,
        }),
      });
      viewer.scene.globe.enableLighting = true;
      setTimeout(() => document.getElementById('loading').classList.add('gone'), 2000);
      loadScene(getHash());
      tick();
    } catch (e2) {
      msg.textContent = 'Fatal error: ' + e2.message;
    }
  }
}

function getHash() {
  const h = location.hash.replace('#','').replace('scene=','');
  return SCENES[h] ? h : 'camp-fire';
}

// ─── SCENE LOADING ──────────────────────────────────
function loadScene(id) {
  cur = id;
  const s = SCENES[id];
  prog = 0; playing = false;

  // UI
  document.getElementById('i-title').textContent = s.title;
  document.getElementById('i-desc').textContent = s.desc;
  document.getElementById('i-stats').innerHTML = s.stats.map(([k,v])=>`<div class="sr"><span>${k}</span><span>${v}</span></div>`).join('');
  document.getElementById('info-src').textContent = 'Data: ' + s.src;
  document.getElementById('btn-play').innerHTML = '▶ Play';
  document.getElementById('timeline').value = 0;
  document.getElementById('pct').textContent = '0%';
  orbiting = true;
  orbAngle = 0;
  document.getElementById('btn-orbit').classList.add('on');

  // Highlight active scene button
  document.querySelectorAll('#scene-sel button').forEach(b => b.classList.remove('on'));
  const selBtn = document.getElementById('sel-' + id);
  if (selBtn) selBtn.classList.add('on');

  updateLabels();

  // Clear old entities
  viewer.entities.removeAll();
  smokeEmitters.forEach(p => viewer.scene.primitives.remove(p));
  smokeEmitters = [];
  calloutEntities = [];
  fireEnt = null;
  lastStoryStage = -1;

  // Fly to
  viewer.camera.flyTo({
    destination: Cesium.Cartesian3.fromDegrees(s.lon, s.lat, s.alt),
    orientation: { heading: Cesium.Math.toRadians(s.heading), pitch: Cesium.Math.toRadians(s.pitch), roll: 0 },
    duration: 3,
  });

  // Create overlays based on type
  if (s.type === 'fire') createFire(s);
  else if (s.type === 'glacier') createGlacier(s);
  else if (s.type === 'flood') createFlood(s);
  else if (s.type === 'deforestation') createDeforestation(s);
  else if (s.type === 'drought') createDrought(s);

  createSceneCallouts(s);
  updateStoryPanel();

  // Auto-play
  setTimeout(() => { if (!playing) togglePlay(); }, 4000);
}

// ─── FIRE OVERLAY ───────────────────────────────────
function createFire(s) {
  const o = { lon: s.fireLon, lat: s.fireLat };

  // Burn area (dark, expanding)
  viewer.entities.add({
    position: Cesium.Cartesian3.fromDegrees(o.lon, o.lat),
    ellipse: {
      semiMinorAxis: new Cesium.CallbackProperty(() => Math.max(1, prog * s.maxR * 0.7), false),
      semiMajorAxis: new Cesium.CallbackProperty(() => Math.max(1, prog * s.maxR), false),
      material: new Cesium.ColorMaterialProperty(
        new Cesium.CallbackProperty(() => Cesium.Color.fromAlpha(Cesium.Color.BLACK, 0.5 * Math.min(prog*3,1)), false)
      ),
      heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
      classificationType: Cesium.ClassificationType.BOTH,
    },
  });

  // Active fire front (orange glow, pulsing)
  fireEnt = viewer.entities.add({
    position: Cesium.Cartesian3.fromDegrees(o.lon, o.lat),
    ellipse: {
      semiMinorAxis: new Cesium.CallbackProperty(() => Math.max(1, prog * s.maxR * 0.7), false),
      semiMajorAxis: new Cesium.CallbackProperty(() => Math.max(1, prog * s.maxR), false),
      material: Cesium.Color.TRANSPARENT,
      outline: true,
      outlineColor: new Cesium.CallbackProperty(() => {
        const p = 0.6 + Math.sin(Date.now()*0.006)*0.4;
        return new Cesium.Color(1, 0.4, 0, p * Math.min(prog*4,1));
      }, false),
      outlineWidth: 4,
      heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
    },
  });

  // Smoke particle emitters along fire front
  const smokeImg = makeSmokeCanvas();
  for (let i = 0; i < 12; i++) {
    const angle = (i/12) * Math.PI * 2;
    const r = s.maxR * 0.5;
    const lon = o.lon + (Math.cos(angle) * r) / 111320;
    const lat = o.lat + (Math.sin(angle) * r) / 110540;

    try {
      const ps = viewer.scene.primitives.add(new Cesium.ParticleSystem({
        image: smokeImg,
        imageSize: new Cesium.Cartesian2(80, 80),
        startScale: 0.5,
        endScale: 6.0,
        startColor: new Cesium.Color(0.4, 0.35, 0.3, 0.6),
        endColor: new Cesium.Color(0.6, 0.55, 0.5, 0.0),
        minimumParticleLife: 3.0,
        maximumParticleLife: 8.0,
        minimumSpeed: 3.0,
        maximumSpeed: 8.0,
        emissionRate: 4.0,
        emitter: new Cesium.CircleEmitter(100.0),
        modelMatrix: Cesium.Transforms.eastNorthUpToFixedFrame(
          Cesium.Cartesian3.fromDegrees(lon, lat, 300)
        ),
        lifetime: 16.0,
        sizeInMeters: true,
      }));
      smokeEmitters.push(ps);
    } catch(e) { console.warn('Particle error:', e.message); }
  }
}

// ─── GLACIER OVERLAY ────────────────────────────────
function createGlacier(s) {
  // Ice extent (shrinking)
  viewer.entities.add({
    position: Cesium.Cartesian3.fromDegrees(s.lon, s.lat),
    ellipse: {
      semiMinorAxis: new Cesium.CallbackProperty(() => {
        const ext = s.iceStart - prog * (s.iceStart - s.iceEnd);
        return ext * 15000;
      }, false),
      semiMajorAxis: new Cesium.CallbackProperty(() => {
        const ext = s.iceStart - prog * (s.iceStart - s.iceEnd);
        return ext * 25000;
      }, false),
      material: new Cesium.ColorMaterialProperty(
        new Cesium.CallbackProperty(() => new Cesium.Color(0.7, 0.88, 0.97, 0.35), false)
      ),
      heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
      classificationType: Cesium.ClassificationType.BOTH,
    },
  });

  // Exposed rock (growing)
  viewer.entities.add({
    position: Cesium.Cartesian3.fromDegrees(s.lon, s.lat),
    ellipse: {
      semiMinorAxis: new Cesium.CallbackProperty(() => s.iceStart * 15000, false),
      semiMajorAxis: new Cesium.CallbackProperty(() => s.iceStart * 25000, false),
      material: new Cesium.ColorMaterialProperty(
        new Cesium.CallbackProperty(() => new Cesium.Color(0.3, 0.2, 0.15, 0.2 * prog), false)
      ),
      heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
      classificationType: Cesium.ClassificationType.BOTH,
    },
  });

  // Meltwater streams
  for (let i = 0; i < 5; i++) {
    const ang = (i/5) * Math.PI * 0.8 - 0.2;
    const pts = [];
    for (let j = 0; j < 8; j++) {
      const t = j/7, len = 8000 + i*3000;
      pts.push(s.lon + (Math.cos(ang)*t*len + Math.sin(t*5+i)*200)/111320);
      pts.push(s.lat + (Math.sin(ang)*t*len + Math.cos(t*3+i)*150)/110540);
    }
    viewer.entities.add({
      polyline: {
        positions: Cesium.Cartesian3.fromDegreesArray(pts),
        width: new Cesium.CallbackProperty(() => 1 + prog * 4, false),
        material: new Cesium.ColorMaterialProperty(
          new Cesium.CallbackProperty(() => new Cesium.Color(0.2, 0.5, 0.85, prog * 0.6), false)
        ),
        clampToGround: true,
      },
    });
  }
}

// ─── FLOOD OVERLAY ─────────────────────────────────
function createFlood(s) {
  const lon = s.floodLon, lat = s.floodLat, maxR = s.maxFlood;
  const bands = s.floodBands || [
    { lon, lat, major: maxR, minor: maxR * 0.55, heading: 0, label: 'Flood extent' },
  ];

  bands.forEach((band, idx) => {
    const delay = idx * 0.08;
    const bandProgress = () => Math.max(0.08, Math.min(1, (prog - delay) / (1 - delay)));

    // Elevated, semi-transparent flood volume. Kept above terrain/tiles so it is visible.
    viewer.entities.add({
      name: band.label || 'Flood zone',
      position: Cesium.Cartesian3.fromDegrees(band.lon, band.lat),
      ellipse: {
        semiMinorAxis: new Cesium.CallbackProperty(() => band.minor * (0.22 + bandProgress() * 0.78), false),
        semiMajorAxis: new Cesium.CallbackProperty(() => band.major * (0.22 + bandProgress() * 0.78), false),
        rotation: Cesium.Math.toRadians(band.heading || 0),
        height: 95 + idx * 8,
        extrudedHeight: 8,
        material: new Cesium.ColorMaterialProperty(
          new Cesium.CallbackProperty(() => {
            const a = 0.26 + 0.34 * Math.min(bandProgress() * 1.5, 1);
            return new Cesium.Color(0.05, 0.42, 0.95, a);
          }, false)
        ),
        outline: true,
        outlineColor: new Cesium.CallbackProperty(() => {
          const pulse = 0.55 + Math.sin(Date.now()*0.004 + idx)*0.25;
          return new Cesium.Color(0.35, 0.78, 1.0, pulse);
        }, false),
        outlineWidth: 4,
      },
    });

    // Sediment/muddy water core so the flood is not just a subtle blue tint.
    viewer.entities.add({
      position: Cesium.Cartesian3.fromDegrees(band.lon, band.lat),
      ellipse: {
        semiMinorAxis: new Cesium.CallbackProperty(() => band.minor * (0.12 + bandProgress() * 0.46), false),
        semiMajorAxis: new Cesium.CallbackProperty(() => band.major * (0.12 + bandProgress() * 0.52), false),
        rotation: Cesium.Math.toRadians((band.heading || 0) - 4),
        height: 110 + idx * 8,
        extrudedHeight: 35,
        material: new Cesium.ColorMaterialProperty(
          new Cesium.CallbackProperty(() => new Cesium.Color(0.48, 0.34, 0.14, 0.18 + 0.22 * bandProgress()), false)
        ),
      },
    });
  });

  // Indus/river flow lines: visible animated corridors instead of tiny ground-clamped strokes.
  for (let i = 0; i < 12; i++) {
    const ang = -Math.PI * 0.58 + (i - 6) * 0.055;
    const pts = [];
    for (let j = 0; j < 9; j++) {
      const t = j/8, len = maxR * (0.35 + i * 0.035);
      pts.push(lon + (Math.cos(ang)*t*len + Math.sin(t*5+i)*900)/111320);
      pts.push(lat + (Math.sin(ang)*t*len + Math.cos(t*3+i)*500)/110540);
      pts.push(180 + i * 8);
    }
    viewer.entities.add({
      polyline: {
        positions: Cesium.Cartesian3.fromDegreesArrayHeights(pts),
        width: new Cesium.CallbackProperty(() => 2 + Math.max(prog, 0.08) * 7, false),
        material: new Cesium.PolylineGlowMaterialProperty({
          glowPower: 0.22,
          color: new Cesium.CallbackProperty(() => new Cesium.Color(0.1, 0.65, 1.0, 0.35 + Math.max(prog, 0.08) * 0.45), false),
        }),
      },
    });
  }
}

// ─── DEFORESTATION OVERLAY ─────────────────────────
function createDeforestation(s) {
  const lon = s.defoLon, lat = s.defoLat, maxR = s.maxDefo;

  // Intact forest (green, shrinking)
  viewer.entities.add({
    position: Cesium.Cartesian3.fromDegrees(lon, lat),
    ellipse: {
      semiMinorAxis: new Cesium.CallbackProperty(() => maxR * (1 - prog * 0.5), false),
      semiMajorAxis: new Cesium.CallbackProperty(() => maxR * 1.2 * (1 - prog * 0.5), false),
      material: new Cesium.ColorMaterialProperty(
        new Cesium.CallbackProperty(() => new Cesium.Color(0.1, 0.45, 0.15, 0.3), false)
      ),
      heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
      classificationType: Cesium.ClassificationType.BOTH,
    },
  });

  // Cleared / burned land (brown, expanding)
  viewer.entities.add({
    position: Cesium.Cartesian3.fromDegrees(lon, lat),
    ellipse: {
      semiMinorAxis: new Cesium.CallbackProperty(() => Math.max(1, prog * maxR * 0.6), false),
      semiMajorAxis: new Cesium.CallbackProperty(() => Math.max(1, prog * maxR * 0.9), false),
      material: new Cesium.ColorMaterialProperty(
        new Cesium.CallbackProperty(() => new Cesium.Color(0.55, 0.35, 0.15, 0.45 * Math.min(prog*3,1)), false)
      ),
      heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
      classificationType: Cesium.ClassificationType.BOTH,
    },
  });

  // Deforestation frontier outline
  viewer.entities.add({
    position: Cesium.Cartesian3.fromDegrees(lon, lat),
    ellipse: {
      semiMinorAxis: new Cesium.CallbackProperty(() => Math.max(1, prog * maxR * 0.6), false),
      semiMajorAxis: new Cesium.CallbackProperty(() => Math.max(1, prog * maxR * 0.9), false),
      material: Cesium.Color.TRANSPARENT,
      outline: true,
      outlineColor: new Cesium.CallbackProperty(() => {
        const p = 0.5 + Math.sin(Date.now()*0.003)*0.3;
        return new Cesium.Color(0.7, 0.4, 0.1, p * Math.min(prog*3,1));
      }, false),
      outlineWidth: 3,
      heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,

  // Road/logging paths cutting into forest
  for (let i = 0; i < 6; i++) {

    for (let j = 0; j < 8; j++) {
      const t = j/7, len = maxR * 0.7 + i*2000;
      pts.push(lon + (Math.cos(ang)*t*len + Math.sin(t*6+i)*400)/111320);
      pts.push(lat + (Math.sin(ang)*t*len + Math.cos(t*4+i)*300)/110540);
    }
    viewer.entities.add({
      polyline: {
        positions: Cesium.Cartesian3.fromDegreesArray(pts),
        width: new Cesium.CallbackProperty(() => 1 + prog * 3, false),
        material: new Cesium.ColorMaterialProperty(
          new Cesium.CallbackProperty(() => new Cesium.Color(0.6, 0.4, 0.2, prog * 0.5), false)

        clampToGround: true,
      },

  }

          new Cesium.CallbackProperty(() => new Cesium.Color(0.3, 0.5, 0.8, 0.4 * (1 - prog * 0.7)), false)

      },

// ─── SMOKE TEXTURE ──────────────────────────────────
// ---- 3D STORY + CALLOUTS -------------------------------------------------
function impactCenter(s) {
  if (s.type === 'flood') return { lon: s.floodLon, lat: s.floodLat, alt: Math.max(9000, s.alt * 0.45) };
  if (s.type === 'fire') return { lon: s.fireLon, lat: s.fireLat, alt: Math.max(4500, s.alt * 0.5) };
  if (s.type === 'deforestation') return { lon: s.defoLon, lat: s.defoLat, alt: Math.max(7000, s.alt * 0.5) };
  if (s.type === 'drought') return { lon: s.droughtLon, lat: s.droughtLat, alt: Math.max(5000, s.alt * 0.5) };
  return { lon: s.lon, lat: s.lat, alt: Math.max(5000, s.alt * 0.5) };
}

function defaultStory(s) {
  if (s.type === 'fire') return [
    { t: 0.00, stage: 'Ignition context', text: 'The first stage shows where heat, wind, dry fuels, and terrain create a fast-moving fire problem.' },
    { t: 0.22, stage: 'Rapid spread', text: 'The burn footprint expands and the orange front marks the active edge where evacuation and suppression pressure rise.' },
    { t: 0.50, stage: 'Community impact', text: 'Smoke, structures, power corridors, access routes, and vulnerable communities become the operational focus.' },
    { t: 0.78, stage: 'Containment + recovery', text: 'After the front passes, watershed damage, debris-flow risk, and long-term rebuilding become the next story.' },
  ];
  if (s.type === 'flood') return [
    { t: 0.00, stage: 'Rainfall setup', text: 'The flood story starts with saturated catchments and river corridors that have limited room for additional runoff.' },
    { t: 0.25, stage: 'Water escapes channels', text: 'Blue volumes show the approximate spread of water into low terrain, settlements, and transport corridors.' },
    { t: 0.55, stage: 'Exposure peaks', text: 'The most important intelligence is who and what sits inside the water footprint: homes, roads, farms, clinics, and shelters.' },
    { t: 0.82, stage: 'Recovery phase', text: 'As water recedes, contamination, damaged infrastructure, disease risk, and livelihood disruption remain.' },
  ];
  if (s.type === 'glacier') return [
    { t: 0.00, stage: 'Baseline ice', text: 'The scene begins with the earlier glacier extent and the downstream systems that depend on seasonal meltwater.' },
    { t: 0.35, stage: 'Retreat accelerates', text: 'The ice surface contracts while meltwater pathways and exposed rock expand.' },
    { t: 0.75, stage: 'Downstream risk', text: 'The story becomes water timing, slope instability, glacial lake growth, and long-term supply changes.' },
  ];
  if (s.type === 'drought') return [
    { t: 0.00, stage: 'Water deficit begins', text: 'Drought is slow-onset: rainfall deficit, heat, soil moisture, and water demand compound over time.' },
    { t: 0.40, stage: 'Stress spreads', text: 'The tan footprint shows worsening vegetation, reservoir, agriculture, and wildfire pressure.' },
    { t: 0.80, stage: 'System pressure', text: 'The impact becomes restrictions, crop loss, groundwater stress, heat-health burden, and fire amplification.' },
  ];
  return [
    { t: 0.00, stage: 'Baseline', text: 'The scene begins with the environmental baseline before the main disturbance becomes visible.' },
    { t: 0.50, stage: 'Impact', text: 'The highlighted footprint shows the main affected area and the systems exposed inside it.' },
    { t: 0.85, stage: 'Recovery', text: 'The final stage focuses on recovery, monitoring, and lessons for preparedness.' },
  ];
}

function activeStoryIndex(s) {
  const beats = s.story || defaultStory(s);
  let idx = 0;
  for (let i = 0; i < beats.length; i++) {
    if (prog >= beats[i].t) idx = i;
  }
  return idx;
}

function activeStoryBeat(s) {
  const beats = s.story || defaultStory(s);
  return beats[activeStoryIndex(s)] || beats[0];
}

function updateStoryPanel() {
  const s = SCENES[cur];
  const beats = s.story || defaultStory(s);
  const idx = activeStoryIndex(s);
  const beat = beats[idx];
  document.getElementById('story-title').textContent = s.title;
  document.getElementById('story-stage').textContent = beat.stage;
  document.getElementById('story-text').textContent = beat.text;
  document.getElementById('story-rail').innerHTML = beats.map((_, i) =>
    `<div class="story-dot ${i <= idx ? 'on' : ''}"></div>`
  ).join('');
  document.getElementById('story-intel').innerHTML = s.stats.slice(0, 4).map(([k, v]) =>
    `<div class="story-chip"><span>${k}</span><strong>${v}</strong></div>`
  ).join('');

  if (idx !== lastStoryStage) {
    lastStoryStage = idx;
    focusActiveCallout(idx);
  }
}

function createSceneCallouts(s) {
  const c0 = impactCenter(s);
  const callouts = s.callouts || [
    { lon: c0.lon, lat: c0.lat, title: 'Impact Focus', text: s.desc, color: s.type === 'fire' ? '#FF6B35' : '#58A6FF' },
  ];

  callouts.forEach((c, i) => {
    const ent = viewer.entities.add({
      position: Cesium.Cartesian3.fromDegrees(c.lon, c.lat, 450 + i * 120),
      point: {
        pixelSize: 12,
        color: Cesium.Color.fromCssColorString(c.color || '#58A6FF'),
        outlineColor: Cesium.Color.WHITE,
        outlineWidth: 2,
        disableDepthTestDistance: Number.POSITIVE_INFINITY,
      },
      label: {
        text: c.title,
        font: '700 14px Inter, sans-serif',
        fillColor: Cesium.Color.WHITE,
        outlineColor: Cesium.Color.BLACK,
        outlineWidth: 3,
        style: Cesium.LabelStyle.FILL_AND_OUTLINE,
        pixelOffset: new Cesium.Cartesian2(0, -28),
        verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
        showBackground: true,
        backgroundColor: new Cesium.Color(0.02, 0.03, 0.06, 0.78),
        backgroundPadding: new Cesium.Cartesian2(8, 5),
        disableDepthTestDistance: Number.POSITIVE_INFINITY,
      },
      description: c.text,
    });
    calloutEntities.push(ent);
  });
}

function focusActiveCallout(idx) {
  if (!calloutEntities.length) return;
  const active = Math.min(idx, calloutEntities.length - 1);
  calloutEntities.forEach((e, i) => {
    if (e.point) e.point.pixelSize = i === active ? 18 : 11;
  });
}

function narrateStoryBeat() {
  const s = SCENES[cur];
  const beat = activeStoryBeat(s);
  const text = `${s.title}. ${beat.stage}. ${beat.text}`;
  try {
    if (window.speechSynthesis) {
      window.speechSynthesis.cancel();
      storyVoice = new SpeechSynthesisUtterance(text);
      storyVoice.rate = 0.92;
      window.speechSynthesis.speak(storyVoice);
    }
  } catch(e) {}
}

function focusImpact() {
  const s = SCENES[cur];
  const c = impactCenter(s);
  viewer.camera.flyTo({
    destination: Cesium.Cartesian3.fromDegrees(c.lon, c.lat, c.alt),
    orientation: {
      heading: Cesium.Math.toRadians(s.heading || 0),
      pitch: Cesium.Math.toRadians(-42),
      roll: 0,
    },
    duration: 1.6,
  });
}

function makeSmokeCanvas() {
  const c = document.createElement('canvas');
  c.width = 64; c.height = 64;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0,'rgba(200,190,180,0.7)');
  g.addColorStop(0.5,'rgba(160,150,140,0.3)');
  g.addColorStop(1,'rgba(120,110,100,0)');
  x.fillStyle = g;
  x.fillRect(0,0,64,64);
  return c.toDataURL();
}

// ─── ANIMATION LOOP ─────────────────────────────────
function tick() {
  requestAnimationFrame(tick);

  if (playing) {
    prog += spd * 0.00025;
    if (prog >= 1) { prog = 1; playing = false; document.getElementById('btn-play').innerHTML = '▶ Replay'; }
    document.getElementById('timeline').value = Math.floor(prog * 1000);
    document.getElementById('pct').textContent = Math.floor(prog*100) + '%';
    updateLabels();
    updateStoryPanel();
    viewer.scene.requestRender();
  }

  if (orbiting && playing) {
    const s = SCENES[cur];
    const c = impactCenter(s);
    orbAngle += 0.0015 * spd;
    const r = c.alt * 0.75;
    const lon = c.lon + (Math.cos(orbAngle) * r) / 111320;
    const lat = c.lat + (Math.sin(orbAngle) * r * 0.4) / 110540;
    const h = c.alt * 0.8 + Math.sin(orbAngle*0.5) * c.alt * 0.15;
    viewer.camera.setView({
      destination: Cesium.Cartesian3.fromDegrees(lon, lat, h),
      orientation: {
        heading: Cesium.Math.toRadians(-orbAngle * 180/Math.PI + 180),
        pitch: Cesium.Math.toRadians(-25 - Math.sin(orbAngle*0.3)*8),
        roll: 0,
      },
    });
    viewer.scene.requestRender();
  }

  // Update smoke visibility based on progress
  smokeEmitters.forEach((ps, i) => {
    if (ps && ps.show !== undefined) {
      ps.show = prog > 0.05;
      ps.emissionRate = Math.min(prog * 15, 8);
    }
  });
}

function updateLabels() {
  const s = SCENES[cur];
  const t0 = s.d0.getTime(), t1 = s.d1.getTime();
  const d = new Date(t0 + prog * (t1 - t0));
  document.getElementById('date-label').textContent = d.toISOString().split('T')[0];
  updateStoryPanel();

  const sl = document.getElementById('stats-label');
  if (s.type === 'fire') {
    const area = s.stats.find(x => x[0]==='Area');
    const totalAcres = parseInt((area?area[1]:'0').replace(/[^0-9]/g,'')) || 153336;
    const ac = Math.floor(prog * totalAcres).toLocaleString();
    sl.textContent = `${ac} acres burned · ${Math.floor(prog*100)}% progression`;
  } else if (s.type === 'glacier') {
    const ice = Math.floor((s.iceStart - prog*(s.iceStart-s.iceEnd))*100);
    const retreat = s.stats.find(x => x[0]==='Retreat');
    const totalKm = parseInt((retreat?retreat[1]:'40').replace(/[^0-9]/g,'')) || 40;
    const km = Math.floor(prog * totalKm);
    sl.textContent = `${ice}% ice · ${km}km retreated`;
  } else if (s.type === 'flood') {
    const pct = Math.floor(prog * 100);
    sl.textContent = `${pct}% flood extent · water level rising`;
  } else if (s.type === 'deforestation') {
    const area = s.stats.find(x => x[0]==='Total');
    const totalKm2 = parseInt((area?area[1]:'50000').replace(/[^0-9]/g,'')) || 50000;
    const km2 = Math.floor(prog * totalKm2).toLocaleString();
    sl.textContent = `${km2} km² cleared · ${Math.floor(prog*100)}% timeline`;
  } else if (s.type === 'drought') {
    const levels = ['D0 Abnormal','D1 Moderate','D2 Severe','D3 Extreme','D4 Exceptional'];
    const lvl = levels[Math.min(4, Math.floor(prog * 5))];
    sl.textContent = `${lvl} · ${Math.floor(prog*100)}% timeline`;
  }
}

// ─── CONTROLS ───────────────────────────────────────
function togglePlay() {
  if (prog >= 1) prog = 0;
  playing = !playing;
  document.getElementById('btn-play').innerHTML = playing ? '⏸ Pause' : '▶ Play';
  viewer.scene.requestRender();
}

function setSpd(s) {
  spd = s;
  ['s1','s2','s5'].forEach(id => document.getElementById(id).classList.remove('on'));
  document.getElementById('s'+s).classList.add('on');
}

function toggleOrbit() {
  orbiting = !orbiting;
  document.getElementById('btn-orbit').classList.toggle('on', orbiting);
  orbAngle = 0;
}

function switchScene(id) { if (id !== cur) loadScene(id); }

function exitSim() {
  try { window.parent.postMessage('exit3D','*'); } catch(e) {}
  try { if (window.flutter_inappwebview) window.flutter_inappwebview.callHandler('exit3D'); } catch(e) {}
}

function showErr(msg) {
  const b = document.getElementById('err-banner');
  b.textContent = msg;
  b.style.display = 'block';
  setTimeout(() => b.style.display = 'none', 8000);
}

document.getElementById('timeline').addEventListener('input', e => {
  prog = parseInt(e.target.value) / 1000;
  document.getElementById('pct').textContent = Math.floor(prog*100)+'%';
  updateLabels();
  updateStoryPanel();
  viewer.scene.requestRender();
});

// Flutter API
window.initSimulation = p => loadScene(p.scene || 'camp-fire');
window.playSimulation = () => { if (!playing) togglePlay(); };
window.pauseSimulation = () => { if (playing) togglePlay(); };
window.seekSimulation = p => { prog = Math.max(0,Math.min(1,p)); document.getElementById('timeline').value = Math.floor(prog*1000); viewer.scene.requestRender(); };

// ─── BOOT ───────────────────────────────────────────
init();
</script>
</body>
</html>
