<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EcoLens - Environmental Story</title>

    <!-- CesiumJS -->
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Widgets/widgets.css" rel="stylesheet">

    <!-- Pannellum 360° Panorama Viewer (local for WebView compatibility) -->
    <link rel="stylesheet" href="lib/pannellum.css">
    <script src="lib/pannellum.js"></script>

    <!-- Howler.js for Spatial Audio (local for WebView compatibility) -->
    <script src="lib/howler.min.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0D1117;
            color: #E6EDF3;
            overflow: hidden;
            touch-action: none;
        }

        #cesiumContainer {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            background: #0D1117;
            transition: opacity 1.5s ease-in-out;
        }

        #panoramaContainer {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
            display: none;
            transition: opacity 1.5s ease-in-out;
        }

        /* Pannellum overrides — hide default controls */
        .pnlm-controls-container {
            display: none !important;
        }

        .pnlm-load-box {
            display: none !important;
        }

        /* Pannellum hotspot styling */
        .pnlm-hotspot-base {
            background: none !important;
            border: none !important;
        }

        .species-hotspot {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(0, 210, 106, 0.3);
            border: 2px solid rgba(0, 210, 106, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            cursor: pointer;
            animation: hotspotPulse 2s ease-in-out infinite;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        @keyframes hotspotPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0, 210, 106, 0.4); }
            50% { transform: scale(1.1); box-shadow: 0 0 20px 10px rgba(0, 210, 106, 0.2); }
        }

        /* Gyroscope permission overlay */
        .gyro-permission-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 500;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .gyro-permission-overlay h3 {
            font-size: 24px;
            color: #E6EDF3;
            margin-bottom: 16px;
            text-align: center;
        }

        .gyro-permission-overlay p {
            font-size: 14px;
            color: #A8B2BD;
            margin-bottom: 32px;
            text-align: center;
            max-width: 300px;
        }

        .gyro-permission-btn {
            background: linear-gradient(135deg, #00D26A, #00b85d);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 210, 106, 0.4);
        }

        .gyro-permission-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 24px rgba(0, 210, 106, 0.5);
        }

        .gyro-skip-btn {
            margin-top: 16px;
            background: transparent;
            color: #6E7681;
            border: none;
            font-size: 13px;
            cursor: pointer;
        }

        .gyro-skip-btn:hover {
            color: #A8B2BD;
        }

        /* Hide CesiumJS default UI */
        .cesium-viewer-toolbar,
        .cesium-viewer-animationContainer,
        .cesium-viewer-timelineContainer,
        .cesium-viewer-bottom,
        .cesium-viewer-fullscreenContainer,
        .cesium-credit-logoContainer,
        .cesium-credit-textContainer {
            display: none !important;
        }

        /* Story overlay with atmospheric vignette */
        .story-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 100;
            background:
                radial-gradient(ellipse at center, transparent 30%, rgba(0, 0, 0, 0.4) 100%),
                linear-gradient(to bottom, rgba(0, 0, 0, 0.3) 0%, transparent 15%, transparent 85%, rgba(0, 0, 0, 0.5) 100%);
        }

        /* Atmospheric particles effect */
        .story-overlay::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image:
                radial-gradient(circle at 20% 30%, rgba(0, 210, 106, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(88, 166, 255, 0.03) 0%, transparent 50%);
            animation: atmosphericPulse 8s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes atmosphericPulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Chapter indicator - more cinematic */
        .chapter-indicator {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 16px;
            pointer-events: auto;
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 24px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .chapter-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .chapter-dot::after {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            border-radius: 50%;
            border: 2px solid transparent;
            transition: all 0.4s ease;
        }

        .chapter-dot.active {
            background: #00D26A;
            box-shadow: 0 0 16px rgba(0, 210, 106, 0.6);
            transform: scale(1.2);
        }

        .chapter-dot.active::after {
            border-color: rgba(0, 210, 106, 0.4);
            animation: dotPulse 2s ease-in-out infinite;
        }

        @keyframes dotPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0; }
        }

        .chapter-dot:hover {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(1.1);
        }

        /* Chapter content panel - cinematic documentary style */
        .chapter-panel {
            position: absolute;
            bottom: 32px;
            left: 32px;
            right: auto;
            max-width: 520px;
            background: linear-gradient(135deg, rgba(13, 17, 23, 0.95), rgba(22, 27, 34, 0.92));
            border: 1px solid rgba(0, 210, 106, 0.2);
            border-radius: 20px;
            padding: 28px;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            pointer-events: auto;
            opacity: 0;
            transform: translateY(30px) scale(0.98);
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.5),
                0 0 40px rgba(0, 210, 106, 0.05),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .chapter-panel.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .chapter-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #00D26A, #58A6FF, #00D26A);
            border-radius: 20px 20px 0 0;
            opacity: 0.8;
        }

        .chapter-number {
            font-size: 11px;
            font-weight: 700;
            color: #00D26A;
            letter-spacing: 3px;
            margin-bottom: 12px;
            text-shadow: 0 0 20px rgba(0, 210, 106, 0.4);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chapter-number::before {
            content: '';
            width: 24px;
            height: 2px;
            background: linear-gradient(90deg, #00D26A, transparent);
        }

        .chapter-title {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #FFFFFF 0%, #E6EDF3 50%, #00D26A 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
            letter-spacing: -0.5px;
        }

        .chapter-description {
            font-size: 15px;
            line-height: 1.7;
            color: #A8B2BD;
            margin-bottom: 24px;
            font-weight: 400;
            letter-spacing: 0.2px;
        }

        /* Data cards - documentary style statistics */
        .data-cards {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .data-card {
            background: linear-gradient(135deg, rgba(22, 27, 34, 0.9), rgba(30, 35, 42, 0.8));
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 16px 20px;
            min-width: 130px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .data-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            background: linear-gradient(to bottom, #00D26A, transparent);
        }

        .data-card:hover {
            transform: translateY(-2px);
            border-color: rgba(0, 210, 106, 0.3);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .data-card-label {
            font-size: 10px;
            font-weight: 600;
            color: #6E7681;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
        }

        .data-card-value {
            font-size: 26px;
            font-weight: 800;
            color: #E6EDF3;
            letter-spacing: -0.5px;
        }

        .data-card-value.risk-high {
            color: #ff6b6b;
            text-shadow: 0 0 20px rgba(218, 54, 51, 0.4);
        }
        .data-card-value.risk-medium {
            color: #ffa94d;
            text-shadow: 0 0 20px rgba(219, 109, 40, 0.4);
        }
        .data-card-value.positive {
            color: #69db7c;
            text-shadow: 0 0 20px rgba(86, 211, 100, 0.4);
        }

        /* Navigation buttons - cinematic controls */
        .nav-buttons {
            position: absolute;
            bottom: 32px;
            right: 32px;
            display: flex;
            gap: 14px;
            pointer-events: auto;
        }

        .nav-btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: rgba(13, 17, 23, 0.9);
            border: 2px solid rgba(255, 255, 255, 0.15);
            color: #E6EDF3;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        }

        .nav-btn:hover {
            background: linear-gradient(135deg, #00D26A, #00b85d);
            border-color: #00D26A;
            transform: scale(1.1);
            box-shadow: 0 6px 24px rgba(0, 210, 106, 0.4);
        }

        .nav-btn:active {
            transform: scale(0.95);
        }

        .nav-btn:disabled {
            opacity: 0.25;
            cursor: not-allowed;
            transform: none;
        }

        .nav-btn:disabled:hover {
            background: rgba(13, 17, 23, 0.9);
            border-color: rgba(255, 255, 255, 0.15);
            transform: none;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        }

        .nav-btn svg {
            width: 22px;
            height: 22px;
        }

        /* Species cards - positioned to avoid chapter panel overlap */
        .species-container {
            position: absolute;
            top: 80px;
            right: 24px;
            width: 260px;
            display: none;
            flex-direction: column;
            gap: 10px;
            pointer-events: auto;
            /* Key fix: limit height to avoid overlap with bottom panel */
            max-height: calc(100vh - 320px);
            overflow-y: auto;
            overflow-x: hidden;
            padding-right: 8px;
            /* Smooth scrollbar */
            scrollbar-width: thin;
            scrollbar-color: rgba(0, 210, 106, 0.5) transparent;
        }

        .species-container::-webkit-scrollbar {
            width: 4px;
        }

        .species-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .species-container::-webkit-scrollbar-thumb {
            background: rgba(0, 210, 106, 0.5);
            border-radius: 2px;
        }

        .species-card {
            background: rgba(13, 17, 23, 0.92);
            border: 1px solid rgba(0, 210, 106, 0.3);
            border-radius: 14px;
            padding: 14px;
            display: flex;
            gap: 12px;
            align-items: center;
            opacity: 0;
            transform: translateX(30px) scale(0.95);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            flex-shrink: 0;
        }

        .species-card.visible {
            opacity: 1;
            transform: translateX(0) scale(1);
        }

        .species-card:hover {
            border-color: rgba(0, 210, 106, 0.6);
            transform: translateX(-4px) scale(1.02);
            box-shadow: 0 6px 24px rgba(0, 210, 106, 0.2);
        }

        .species-icon {
            width: 44px;
            height: 44px;
            min-width: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(0, 210, 106, 0.2), rgba(88, 166, 255, 0.2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .species-info {
            flex: 1;
            min-width: 0;
            overflow: hidden;
        }

        .species-info h4 {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #E6EDF3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .species-status {
            font-size: 10px;
            font-weight: 500;
            padding: 3px 8px;
            border-radius: 6px;
            display: inline-block;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .species-status.endangered {
            background: rgba(218, 54, 51, 0.25);
            color: #ff6b6b;
            border: 1px solid rgba(218, 54, 51, 0.4);
        }

        .species-status.vulnerable {
            background: rgba(219, 109, 40, 0.25);
            color: #ffa94d;
            border: 1px solid rgba(219, 109, 40, 0.4);
        }

        .species-status.safe {
            background: rgba(0, 210, 106, 0.25);
            color: #69db7c;
            border: 1px solid rgba(0, 210, 106, 0.4);
        }

        /* Loading screen - cinematic intro */
        .loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #0D1117, #1a2332, #0D1117);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.8s ease;
        }

        .loading-screen::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(circle at 30% 20%, rgba(0, 210, 106, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 70% 80%, rgba(88, 166, 255, 0.06) 0%, transparent 50%);
            animation: loadingAmbient 4s ease-in-out infinite;
        }

        @keyframes loadingAmbient {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
        }

        .loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
            visibility: hidden;
            display: none;
        }

        .loading-spinner {
            width: 56px;
            height: 56px;
            border: 3px solid rgba(48, 54, 61, 0.5);
            border-top-color: #00D26A;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            position: relative;
            box-shadow: 0 0 30px rgba(0, 210, 106, 0.2);
        }

        .loading-spinner::after {
            content: '';
            position: absolute;
            top: -8px;
            left: -8px;
            right: -8px;
            bottom: -8px;
            border: 2px solid transparent;
            border-top-color: rgba(0, 210, 106, 0.3);
            border-radius: 50%;
            animation: spin 2s linear infinite reverse;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            margin-top: 24px;
            font-size: 16px;
            font-weight: 500;
            color: #E6EDF3;
            letter-spacing: 0.5px;
            position: relative;
            z-index: 1;
        }

        .loading-subtext {
            margin-top: 8px;
            font-size: 13px;
            color: #6E7681;
            position: relative;
            z-index: 1;
        }

        /* Close button */
        .close-btn {
            position: absolute;
            top: 24px;
            right: 24px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(22, 27, 34, 0.9);
            border: 1px solid #30363D;
            color: #E6EDF3;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            z-index: 200;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: #DA3633;
            border-color: #DA3633;
        }

        /* Mobile adjustments */
        @media (max-width: 768px) {
            .chapter-indicator {
                padding: 8px 14px;
                gap: 12px;
            }

            .chapter-dot {
                width: 8px;
                height: 8px;
            }

            .chapter-panel {
                left: 12px;
                right: 12px;
                bottom: 20px;
                padding: 18px;
                max-width: none;
            }

            .chapter-title {
                font-size: 24px;
            }

            .chapter-description {
                font-size: 14px;
                line-height: 1.6;
            }

            .data-cards {
                gap: 8px;
            }

            .data-card {
                min-width: 100px;
                padding: 12px 14px;
            }

            .data-card-value {
                font-size: 20px;
            }

            .nav-buttons {
                right: 12px;
                bottom: 20px;
                gap: 10px;
            }

            .nav-btn {
                width: 44px;
                height: 44px;
            }

            .species-container {
                right: 12px;
                width: 180px;
                top: 70px;
                max-height: calc(100vh - 280px);
            }

            .species-card {
                padding: 10px;
                gap: 10px;
            }

            .species-icon {
                width: 36px;
                height: 36px;
                min-width: 36px;
                font-size: 18px;
            }

            .species-info h4 {
                font-size: 12px;
            }

            .close-btn {
                top: 12px;
                right: 12px;
                width: 36px;
                height: 36px;
            }

            .story-overlay::before {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Loading screen -->
    <div class="loading-screen" id="loadingScreen">
        <!-- FOREST/WILDLIFE video background — NEVER ocean/underwater -->
        <video autoplay muted loop playsinline id="introVideo"
            style="position:absolute;top:0;left:0;width:100%;height:100%;
                   object-fit:cover;opacity:0.3;filter:brightness(0.6);">
            <source src="" id="introVideoSrc" type="video/mp4">
        </video>
        <div style="position:relative;z-index:1;text-align:center;">
            <div class="loading-spinner"></div>
            <div class="loading-text">Loading environmental story...</div>
            <div class="loading-subtext" id="loadingSubtext">Preparing 3D terrain</div>
        </div>
    </div>

    <!-- CesiumJS globe container -->
    <div id="cesiumContainer"></div>

    <!-- 360° Panorama container (Pannellum) -->
    <div id="panoramaContainer"></div>

    <!-- Gyroscope permission overlay (shown on iOS first time) -->
    <div class="gyro-permission-overlay" id="gyroPermissionOverlay" style="display: none;">
        <h3>🌿 Immersive Mode</h3>
        <p>Move your phone to look around the forest. Enable motion sensors for the full experience.</p>
        <button class="gyro-permission-btn" id="enableGyroBtn">Enable Immersive Mode</button>
        <button class="gyro-skip-btn" id="skipGyroBtn">Use Touch Controls Instead</button>
    </div>

    <!-- Story overlay -->
    <div class="story-overlay" id="storyOverlay">
        <!-- Close button -->
        <button class="close-btn" onclick="ChapterManager.closeStory()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M6 18L18 6M6 6l12 12"/>
            </svg>
        </button>

        <!-- Chapter indicators -->
        <div class="chapter-indicator" id="chapterIndicator"></div>

        <!-- Chapter panel -->
        <div class="chapter-panel" id="chapterPanel">
            <div class="chapter-number" id="chapterNumber">CHAPTER 1</div>
            <h2 class="chapter-title" id="chapterTitle">Loading...</h2>
            <p class="chapter-description" id="chapterDescription">
                Preparing your environmental story experience...
            </p>
            <div class="data-cards" id="dataCards"></div>
        </div>

        <!-- Species cards -->
        <div class="species-container" id="speciesContainer"></div>

        <!-- Navigation -->
        <div class="nav-buttons">
            <button class="nav-btn" id="prevBtn" onclick="ChapterManager.previousChapter()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M15 18l-6-6 6-6"/>
                </svg>
            </button>
            <button class="nav-btn" id="nextBtn" onclick="ChapterManager.nextChapter()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 18l6-6-6-6"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- Load external modules -->
    <script src="js/keys.js"></script>
    <script src="js/config.js"></script>
    <script src="js/library-loader.js"></script>
